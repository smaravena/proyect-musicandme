{% extends "app/base.html" %}

{% load static %}

{% block contenido %}
<div class="container min-vh-100 d-flex justify-content-center">
  <div class="row">
      <div class="col align-self-center"> 
          <form
              method="post"
              class="shadow p-4 bg-body-tertiary rounded"
              style="background-color: white" enctype="multipart/form-data">
              <h2>Ingresa Datos de entrega</h2>
              {% csrf_token %}
              {{form.as_p}}
              <button type="submit" class="btn btn-primary">Ingresar</button>
              <a type="button" href="{% url 'lista_discos'%}" class="btn btn-primary">Volver</a>
          </form>
      </div>
  </div>
</div>
{% endblock %}
